# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Push a branch named release/<major>.<minor>.<patch> (e.g. release/17.0.0) to build and publish that version.
# The first segment of the version selects the Umbraco major (and target framework).

name: .NET

env:
  projectName: CurateCoders.CloudFlarePro
  projectConfiguration: Release

on:
  push:
    branches: [ "release/*" ]

jobs:
  build:

    runs-on: windows-2022

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Resolve version
      id: version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#release/}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore -p:UmbracoMajor=${{ steps.version.outputs.major }}
    - name: Build
      run: dotnet build --no-restore -c ${{ env.projectConfiguration }} -p:UmbracoMajor=${{ steps.version.outputs.major }} -p:Version=${{ steps.version.outputs.version }}
    - name: Test
      run: dotnet test --no-build -c ${{ env.projectConfiguration }} --verbosity normal
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish package
      run: dotnet nuget push "src\${{ env.projectName }}\bin\${{ env.projectConfiguration }}\*${{ steps.version.outputs.version }}.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
